<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360 Tour</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.css"><style>
  html, body { margin: 0; height: 100%; background: #000; }
  #viewer { width: 100%; height: 100%; }
  #banner {
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 5; pointer-events: none; overflow: hidden;
    padding: 0.6em 0; text-align: center;
    background: rgba(255, 212, 0, 0.3);
    /* difference inverts against whatever's behind it, so the white text reads dark over the
       bright windows/headliner instead of vanishing the way screen did */
    mix-blend-mode: difference;
    opacity: 0.8;
    color: #ffffff;
    font-family: 'Formular', system-ui, sans-serif;
    font-weight: 700;
    font-size: 12pt;
    letter-spacing: 0.2em;
  }
  .psv-tooltip, .psv-tooltip .psv-tooltip-content {
    color: #ffffff;
    font-family: 'Formular', system-ui, sans-serif;
    font-weight: 400;
    font-size: 12pt;
    text-shadow: none;
  }
  .psv-tooltip .psv-tooltip-content { padding: 0.7em; }
  /* header keeps the tooltip's existing look (Formular 400/12pt/white); body is
     deliberately smaller and dimmer so the two read as a clear hierarchy, not two
     lines of the same weight */
  .psv-tooltip-content h1 { margin: 0 0 0.3em; font: 400 12pt 'Formular', system-ui, sans-serif; color: #ffffff; }
  .psv-tooltip-content p { margin: 0; font: 400 10pt 'Formular', system-ui, sans-serif; color: rgba(255, 255, 255, 0.65); line-height: 1.35; }
  /* video preview thumbnail bleeds to the tooltip's edges rather than sitting inset by the
     content div's own padding (0.7em, matched here so the math cancels out exactly) */
  .psv-tooltip-content img { display: block; width: calc(100% + 1.4em); margin: -0.7em -0.7em 0.4em; border-radius: 2px 2px 0 0; }
  /* content-type label (e.g. "White Paper") above the thumbnail — sits in the normal padded
     flow, so the image below it keeps its left/right/bottom bleed but not its top bleed,
     or it would slide up underneath this label instead of sitting below it */
  .psv-tooltip-content .tt-kind { display: block; margin: 0 0 0.35em; font: 700 8pt 'Formular', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); }
  /* arrows have no tooltip/click yet, so PSV's default marker cursor ("move") shows instead
     of "pointer" — override it so they still read as clickable on hover */
  .psv-marker.tour-arrow { cursor: pointer; }
  .psv-tooltip-content .tt-kind + img { margin-top: 0; }
  .psv-tooltip { background: #000000; border-radius: 2px; box-shadow: none; }
  .psv-tooltip--top-left .psv-tooltip-arrow, .psv-tooltip--top-center .psv-tooltip-arrow, .psv-tooltip--top-right .psv-tooltip-arrow { border-top-color: #000000; }
  .psv-tooltip--bottom-left .psv-tooltip-arrow, .psv-tooltip--bottom-center .psv-tooltip-arrow, .psv-tooltip--bottom-right .psv-tooltip-arrow { border-bottom-color: #000000; }
  .psv-tooltip--left-top .psv-tooltip-arrow, .psv-tooltip--center-left .psv-tooltip-arrow, .psv-tooltip--left-bottom .psv-tooltip-arrow { border-left-color: #000000; }
  .psv-tooltip--right-top .psv-tooltip-arrow, .psv-tooltip--center-right .psv-tooltip-arrow, .psv-tooltip--right-bottom .psv-tooltip-arrow { border-right-color: #000000; }
  #card { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
  #card.open { display: flex; }
  #card .box { position: relative; width: min(92vw, 720px); background: #000000; border-radius: 2px; color: #ffffff; font-family: 'Formular', system-ui, sans-serif; }
  #card .video { aspect-ratio: 16 / 9; width: 100%; }
  #card iframe { display: block; width: 100%; height: 100%; border: 0; }
  #card .text { padding: 0.75em 1em 1em; }
  #card h2 { margin: 0 0 0.4em; font-size: 14pt; font-weight: 700; }
  #card p { margin: 0; font-size: 12pt; font-weight: 400; line-height: 1.4; }
  #card p:empty { display: none; }
  #card .close { position: absolute; top: -2.4em; right: 0; padding: 0.4em 0.6em; border: 0; background: none; color: #ffffff; font: 400 16pt system-ui; cursor: pointer; }
  /* map/legend inset: caption strip on top, aerial below. 80% opacity at rest so it sits back
     from the panorama, full opacity while the pointer is over it so zone highlights read clearly */
  #map { position: fixed; right: 12px; top: 12px; width: 240px; z-index: 10; overflow: hidden; background: #000000; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 6px; opacity: 0.8; transition: opacity 0.2s; }
  #map:hover { opacity: 1; }
  #map-caption { padding: 6px 8px 5px; color: #ffffff; font: 700 8pt 'Formular', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  #map-caption small { font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: rgba(255, 255, 255, 0.65); margin-left: 6px; }
  #map-view { position: relative; height: 160px; }
  #map-svg { display: block; width: 100%; height: 100%; }
  /* hot zones: invisible until hovered, then filled in the zone yellow from the Illustrator file */
  #map-svg .zone { fill: #ffc200; fill-opacity: 0; cursor: pointer; transition: fill-opacity 0.15s; }
  #map-svg .zone:hover { fill-opacity: 0.6; }
  #map-svg .zone.current { fill: #ff9500; fill-opacity: 0.75; cursor: default; }
  #map-label { position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; background: #000000; border-radius: 2px; color: #ffffff; font: 700 8pt 'Formular', system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  #map-label.show { opacity: 1; }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="banner">UNDER CONSTRUCTION</div>
<div id="map"><div id="map-caption">You Are Here<small id="map-here"></small></div><div id="map-view"><svg id="map-svg" viewBox="0 0 1200 800"></svg><div id="map-label"></div></div></div>
<div id="card"><div class="box">
  <button class="close" aria-label="Close">✕</button>
  <div class="video"></div>
  <div class="text"><h2></h2><p></p></div>
</div></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169/build/three.module.js",
  "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
  "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js"
} }
</script>
<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

// markers that open a video card instead of only a tooltip. thumbnail is fetched once via
// Vimeo's oEmbed endpoint (vimeo.com/api/oembed.json?url=...) and hardcoded here, same as
// every other hand-placed value on this page — no runtime API call needed to show it.
const cards = {};

// markers that open a link in a new window. `label` is just for the hover preview (used when
// there's no `preview` block) — the marker still opens `url` on click, unchanged either way.
// `preview` is a richer hover format (image + title + description), used when the destination
// page happens to publish Open Graph tags — fetched once and hardcoded here, same idea as the
// video thumbnails above, not a live fetch from the page itself.
const links = {};

// marker names shown as the tooltip header — best guesses from where each one sits in the car
const names = {
  spot1: 'Driver Door', spot2: 'Center Touchscreen', spot3: 'Glovebox', spot4: 'Passenger Door',
  spot5: 'Passenger Seat', spot6: 'Side Mirror', spot7: 'Rear Door Controls', spot8: 'Rear Footwell',
  spot9: 'Driver Window', spot10: 'Right Rear Headrest', spot11: 'Rear Window', spot12: 'Left Rear Headrest',
  spot13: 'Rear Seatbelt', spot14: 'Rear Door Panel', spot15: 'Rear Floor Mat', spot16: 'Center Console Controls',
};

// placeholder body copy while we test the header/body layout — swap for real text per marker later
const lorem = '<p>Lorem ipsum dolor sit amet consectetur adipiscing elit et quas ad distinctio deleniti temporibus ipsum aute tempore sit sint et aliquip autem mollitia.</p>';

// Three tooltip formats: a video marker previews its thumbnail + title, a link marker
// previews its label + destination domain, and everything else gets the plain header/body.
// All three still keep their click behavior (opens the video card / the link) unchanged —
// this only changes what shows on hover, before that click.
function previewFor(id) {
  if (cards[id]) {
    const c = cards[id];
    return `<img src="${c.thumbnail}" alt=""><h1>${c.title}</h1>${c.description ? `<p>${c.description}</p>` : ''}`;
  }
  if (links[id]) {
    const l = links[id];
    if (l.preview) {
      const kind = l.preview.kind ? `<span class="tt-kind">${l.preview.kind}</span>` : '';
      return `${kind}<img src="${l.preview.image}" alt=""><h1>${l.preview.title}</h1><p>${l.preview.description}</p>`;
    }
    const site = l.site || new URL(l.url).hostname.replace(/^www\./, '');
    return `<h1>↗ ${l.label}</h1><p>${site}</p>`;
  }
  return `<h1>${names[id]}</h1>${lorem}`;
}

const livingMarkers = [
  { id: 'spot1', position: { yaw: '322.0deg', pitch: '-18.0deg' }, image: 'icons/coins.webp' },
  { id: 'spot2', position: { yaw: '2.2deg', pitch: '-11.5deg' }, image: 'icons/cube.webp' },
  { id: 'spot3', position: { yaw: '14.8deg', pitch: '-21.5deg' }, image: 'icons/cylinder.webp' },
  { id: 'spot4', position: { yaw: '38.0deg', pitch: '-16.8deg' }, image: 'icons/torus.webp' },
  { id: 'spot5', position: { yaw: '33.2deg', pitch: '-31.1deg' }, image: 'icons/pentagon.webp' },
  { id: 'spot6', position: { yaw: '45.2deg', pitch: '2.7deg' }, image: 'icons/triangle.webp' },
  { id: 'spot7', position: { yaw: '86.2deg', pitch: '-27.2deg' }, image: 'icons/coins.webp' },
  { id: 'spot8', position: { yaw: '89.1deg', pitch: '-47.4deg' }, image: 'icons/cube.webp' },
  { id: 'spot9', position: { yaw: '316.4deg', pitch: '1.5deg' }, image: 'icons/cylinder.webp' },
  { id: 'spot10', position: { yaw: '152.6deg', pitch: '-0.6deg' }, image: 'icons/pentagon.webp' },
  { id: 'spot11', position: { yaw: '162.3deg', pitch: '1.7deg' }, image: 'icons/torus.webp' },
  { id: 'spot12', position: { yaw: '198.3deg', pitch: '1.5deg' }, image: 'icons/triangle.webp' },
  { id: 'spot13', position: { yaw: '206.7deg', pitch: '-1.3deg' }, image: 'icons/coins.webp' },
  { id: 'spot14', position: { yaw: '274.3deg', pitch: '-27.6deg' }, image: 'icons/cube.webp' },
  { id: 'spot15', position: { yaw: '274.4deg', pitch: '-50.2deg' }, image: 'icons/cylinder.webp' },
  { id: 'spot16', position: { yaw: '350.5deg', pitch: '-22.2deg' }, image: 'icons/triangle.webp' },
].map(m => ({ ...m, size: { width: 45, height: 48 }, tooltip: { content: previewFor(m.id), trigger: !cards[m.id] && !links[m.id] && matchMedia('(hover: none)').matches ? 'click' : 'hover' } }));

// direction arrows, placed for now with no click action
const arrowSvg = '<svg viewBox="0 0 100 100" width="27" height="27"><circle cx="50" cy="50" r="44" fill="#ffffff"/><path d="M28 58 L50 36 L72 58" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const arrowMarkers = [].map(m => ({ ...m, html: arrowSvg, size: { width: 27, height: 27 }, className: 'tour-arrow' }));

// opening view, also where hovering the map's "you are here" zone re-centers to
const START_VIEW = { yaw: '0deg', pitch: '0deg' };
const viewer = new Viewer({
  container: 'viewer', panorama: 'photo.jpg', defaultZoomLvl: 30, navbar: false,
  defaultYaw: START_VIEW.yaw, defaultPitch: START_VIEW.pitch,
  plugins: [[MarkersPlugin, { markers: [...livingMarkers, ...arrowMarkers] }]],
});

viewer.addEventListener('click', ({ data }) => {
  const d = r => (r * 180 / Math.PI).toFixed(1) + 'deg';
  console.log(`{ yaw: '${d(data.yaw)}', pitch: '${d(data.pitch)}' }`);
});

const card = document.getElementById('card');
const openCard = c => {
  const frame = document.createElement('iframe');
  frame.src = `https://player.vimeo.com/video/${c.vimeo}?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479`;
  frame.allow = 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share';
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  frame.title = c.title;
  card.querySelector('.video').replaceChildren(frame);
  card.querySelector('h2').textContent = c.title;
  card.querySelector('p').textContent = c.description;
  card.classList.add('open');
};
const closeCard = () => {
  card.classList.remove('open');
  card.querySelector('.video').replaceChildren();   // removing the iframe stops playback
};
viewer.getPlugin(MarkersPlugin).addEventListener('select-marker', ({ marker }) => {
  if (cards[marker.id]) openCard(cards[marker.id]);
  if (links[marker.id]) window.open(links[marker.id].url, '_blank', 'noopener,noreferrer');
});
card.addEventListener('click', e => { if (e.target === card || e.target.classList.contains('close')) closeCard(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

// Map/legend inset. Background is the aerial from the Illustrator artboard (360Tour_Map.svg,
// 1200x800) flattened to map/aerial.webp with its clip/rotation/scale baked in; the hot zones
// below are that file's shapes copied verbatim, so they share its 1200x800 coordinates. Zones
// stay invisible until hovered, then fill and show their name; hovering a zone with an `arrow`
// also turns the panorama to face that arrow (the way there) and pulses it. `target` is where a click will
// navigate once there's a second panorama to go to — until then a click just logs the zone.
// Same design as the Swift app's exporter (RR_360_Tour_Swift/Export/HTMLBuilder.swift) — carry
// changes back there once settled.
const mapZones = [
  { id: 'alcove', name: 'Alcove', target: null, current: true,
    shape: '<rect x="357.65" y="254.71" width="264.24" height="83.32"/>' },
  { id: 'alcove-2', name: 'Tech Theater', target: null,
    shape: '<path d="M756.42,309.68c-2.87.55-8.73,4.76-21.78,31.57-6.11,12.54-14.11,95.6-3.18,117.46.73,1.45-.79,10.25,7.47,23.29,6.39,10.08,9.74,23.6,22.55,24.37,20.97,1.26,33.93-29.13,34.1-33.66,1.17-31.69,2.19-82.38,1.27-114.46-.52-17.96-15.46-36.71-22.28-42.24-4.73-3.84-7.53-8.37-18.15-6.33Z"/>' },
  { id: 'entrance', name: 'Entrance', target: null,
    shape: '<rect x="758.24" y="332.32" width="295.12" height="153.13" transform="translate(1314.6806 -496.9137) rotate(90)"/>' },
  { id: 'back-of-house', name: 'Back of House', target: null,
    shape: '<rect x="365.36" y="482.34" width="264.24" height="83.32"/>' },
];
// the zone with `current: true` is where this panorama was taken: it stays lit instead of only
// on hover, and its name fills the caption ("You are here · Tech Theater")
document.getElementById('map-here').textContent = mapZones.find(z => z.current)?.name ?? '';
// aim a little above the arrow rather than dead-center on it, so it lands just below the
// mid-screen UNDER CONSTRUCTION banner instead of behind it (can go to 0 once the banner does)
const ARROW_VIEW_LIFT = 8;   // degrees

// After Effects-style easy ease for the turn: 70% influence out of the start keyframe and 70% into
// the end one, both at 0 speed — i.e. cubic-bezier(0.7, 0, 0.3, 1). Solves the bezier's x for t
// (Newton's method, falling back to bisection), then returns its y.
const cubicBezier = (x1, y1, x2, y2) => {
  const bez = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  const dBez = (t, a, b) => 3 * a * (1 - t) ** 2 + 6 * (b - a) * t * (1 - t) + 3 * (1 - b) * t * t;
  return x => {
    if (x <= 0 || x >= 1) return x <= 0 ? 0 : 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const d = dBez(t, x1, x2);
      if (Math.abs(d) < 1e-6) break;
      t -= (bez(t, x1, x2) - x) / d;
    }
    if (!(t >= 0 && t <= 1) || Math.abs(bez(t, x1, x2) - x) > 1e-5) {
      let lo = 0, hi = 1;
      for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (bez(t, x1, x2) < x) lo = t; else hi = t; }
    }
    return bez(t, y1, y2);
  };
};
const EASE_70_70 = cubicBezier(0.7, 0, 0.3, 1);
const mapSvg = document.getElementById('map-svg');
const mapLabel = document.getElementById('map-label');
mapSvg.innerHTML = '<image href="map/aerial.webp" width="1200" height="800"/>' +
  mapZones.map(z => `<g class="zone${z.current ? ' current' : ''}" data-zone="${z.id}">${z.shape}</g>`).join('');
mapSvg.querySelectorAll('.zone').forEach(g => {
  const zone = mapZones.find(z => z.id === g.dataset.zone);
  const arrow = zone.arrow && arrowMarkers.find(a => a.id === zone.arrow);
  const arrowEl = () => arrow && document.getElementById(`psv-marker-${arrow.id}`);
  g.addEventListener('mouseenter', () => {
    mapLabel.textContent = zone.name; mapLabel.classList.add('show');
    // "you are here" zone re-centers on the opening view; any other zone turns the panorama to
    // face the arrow that leads there, and pulses it
    if (zone.current) {
      viewer.animate({ ...START_VIEW, speed: 1000, easing: EASE_70_70 });
    } else if (arrow) {
      viewer.animate({ yaw: arrow.position.yaw, pitch: `${parseFloat(arrow.position.pitch) + ARROW_VIEW_LIFT}deg`, speed: 1000, easing: EASE_70_70 });
      arrowEl()?.classList.add('tour-arrow--focus');
    }
  });
  g.addEventListener('mouseleave', () => {
    mapLabel.classList.remove('show');
    arrowEl()?.classList.remove('tour-arrow--focus');
  });
  g.addEventListener('click', () => console.log(`map zone: ${zone.id}`, zone.target ?? '(no target yet)'));
});

// banner timeline, in frames
const FPS = 30, DROP = 9, STAGGER = 60, HOLD = 150, FADE = 30;
const TOTAL = STAGGER + HOLD + FADE;
const banner = document.getElementById('banner');
const text = banner.textContent;
banner.textContent = '';
const spans = [...text].map(ch => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? ' ' : ch;
  s.style.display = 'inline-block';
  banner.append(s);
  return s;
});
const letters = spans.filter(s => s.textContent !== ' ');
letters.forEach((s, i) => {
  const start = Math.round(i * (STAGGER - DROP) / (letters.length - 1));
  const at = frame => frame / TOTAL;
  s.animate([
    { opacity: 0, transform: 'translateY(-50px)', offset: 0 },
    { opacity: 0, transform: 'translateY(-50px)', offset: at(start) },
    { opacity: 1, transform: 'translateY(0)', offset: at(start + DROP) },
    { opacity: 1, transform: 'translateY(0)', offset: at(STAGGER + HOLD) },
    { opacity: 0, transform: 'translateY(0)', offset: 1 },
  ], { duration: TOTAL / FPS * 1000, iterations: Infinity });
});
</script>
</body>
</html>
